name: CI

# Spusti pipeline pri kazdem push na jakoukoli vetev a pri pull requestu do main
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:

  # -----------------------------------------------------------------------
  # Job 1: Sestaveni + testy + JaCoCo coverage report
  # -----------------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # Maven cache = rychlejsi pipeline (stahuje jen zmenene zavislosti)

      - name: Build and run all tests with coverage
        run: mvn verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7    # zprava dostupna 7 dni po spusteni

  # -----------------------------------------------------------------------
  # Job 2: Staticka analyza (SpotBugs)
  # Bezi az po uspesnem test jobu — nema smysl analyzovat kod ktery ani neprojde testy
  # -----------------------------------------------------------------------
  analyse:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: test              # zavislost: test job musi projit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile (SpotBugs analyzuje bytekod, ne zdrojaky)
        run: mvn compile -q

      - name: Run SpotBugs static analysis
        run: mvn spotbugs:check

  # -----------------------------------------------------------------------
  # Job 3: Docker image
  # Bezi zaroven s analyse (oba zavisi na test, ne na sobe navzajem)
  # Push do ghcr.io pouze pri push na main vetev
  # -----------------------------------------------------------------------
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: test              # zavislost: test job musi projit

    permissions:
      contents: read
      packages: write        # potrebne pro push do GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (testy uz probehly v job test)
        run: mvn package -DskipTests -q

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automaticky token, neni treba nastavovat

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}   # push jen z main vetve
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
