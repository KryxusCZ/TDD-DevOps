<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prihlaseni - Room Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh">
    <div class="card shadow" style="width: 400px">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Room Booking</h3>

            <!-- zprava po odhlaseni -->
            <div th:if="${param.logout}" class="alert alert-info">Byli jste odhlaseni.</div>
            <!-- zprava pri chybnem prihlaseni -->
            <div th:if="${param.error}" class="alert alert-danger">Spatne uzivatelske jmeno nebo heslo.</div>

            <!-- Spring Security zpracovava POST /login automaticky -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Uzivatelske jmeno</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Heslo</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Prihlasit se</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
