<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Moje rezervace - Room Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a th:href="@{/rooms}" class="navbar-brand">Room Booking</a>
        <form th:action="@{/logout}" method="post" class="mb-0">
            <button type="submit" class="btn btn-outline-light btn-sm">Odhlasit</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Moje rezervace</h2>
        <a th:href="@{/rooms}" class="btn btn-primary">Nova rezervace</a>
    </div>

    <!-- flash zpravy po presmerovani -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- prazdny stav -->
    <div th:if="${#lists.isEmpty(bookings)}" class="text-muted">
        Zadne rezervace. <a th:href="@{/rooms}">Rezervujte mistnost.</a>
    </div>

    <!-- tabulka rezervaci -->
    <table th:unless="${#lists.isEmpty(bookings)}" class="table table-bordered table-hover">
        <thead class="table-light">
            <tr>
                <th>Mistnost</th>
                <th>Od</th>
                <th>Do</th>
                <th>Stav</th>
                <th>Akce</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.room.name}">A101</td>
                <!-- #temporals formatuje LocalDateTime pro zobrazeni -->
                <td th:text="${#temporals.format(booking.startTime, 'dd.MM.yyyy HH:mm')}">cas</td>
                <td th:text="${#temporals.format(booking.endTime, 'dd.MM.yyyy HH:mm')}">cas</td>
                <td>
                    <!-- badge zmeni barvu podle stavu rezervace -->
                    <span th:text="${booking.status}"
                          th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'bg-success' :
                                         (${booking.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-warning')"
                          class="badge">stav</span>
                </td>
                <td>
                    <!-- tlacitko Zrusit zobrazit pouze pro CONFIRMED rezervace -->
                    <form th:if="${booking.status.name() == 'CONFIRMED'}"
                          th:action="@{/bookings/{id}/cancel(id=${booking.id})}"
                          method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Opravdu zrusit rezervaci?')">
                            Zrusit
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
