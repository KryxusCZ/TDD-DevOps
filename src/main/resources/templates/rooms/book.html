<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rezervace - Room Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a th:href="@{/rooms}" class="navbar-brand">Room Booking</a>
        <form th:action="@{/logout}" method="post" class="mb-0">
            <button type="submit" class="btn btn-outline-light btn-sm">Odhlasit</button>
        </form>
    </div>
</nav>

<div class="container mt-4" style="max-width: 700px">
    <h2>Rezervace mistnosti</h2>

    <!-- info o mistnosti -->
    <div class="card mb-4 bg-light">
        <div class="card-body">
            <h5 class="mb-1" th:text="${room.name}">Nazev</h5>
            <p class="mb-1 text-muted" th:text="${room.description}">Popis</p>
            <small>Kapacita: <strong th:text="${room.capacity}">0</strong> osob</small>
        </div>
    </div>

    <!-- obsazene casy — uzivatel vidi kdy rezervovat nelze -->
    <div class="mb-4">
        <h6>Jiz obsazene casy:</h6>
        <div th:if="${#lists.isEmpty(existingBookings)}" class="text-success">
            Mistnost je volna — zadne rezervace.
        </div>
        <table th:unless="${#lists.isEmpty(existingBookings)}"
               class="table table-sm table-bordered">
            <thead class="table-warning">
                <tr>
                    <th>Od</th>
                    <th>Do</th>
                    <th>Stav</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="b : ${existingBookings}">
                    <td th:text="${#temporals.format(b.startTime, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(b.endTime,   'dd.MM.yyyy HH:mm')}"></td>
                    <td>
                        <span th:text="${b.status}"
                              th:classappend="${b.status.name() == 'CONFIRMED'} ? 'bg-danger' : 'bg-warning'"
                              class="badge">stav</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- chybova zprava z business pravidel (napr. kolize, spatna delka) -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- rezervacni formular -->
    <form th:action="@{/rooms/{id}/book(id=${room.id})}"
          th:object="${bookingRequest}"
          method="post">

        <div class="mb-3">
            <label class="form-label">Zacatek rezervace</label>
            <input type="datetime-local" th:field="*{startTime}" class="form-control"
                   th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{startTime}">Chyba</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Konec rezervace</label>
            <input type="datetime-local" th:field="*{endTime}" class="form-control"
                   th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{endTime}">Chyba</div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Potvrdit rezervaci</button>
            <a th:href="@{/rooms}" class="btn btn-outline-secondary">Zpet</a>
        </div>
    </form>
</div>

</body>
</html>
